<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Push-up movement guide</title>
  <desc id="desc">Two simple line figures show a high plank and lowered push-up position.</desc>
