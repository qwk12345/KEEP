  <path d="M70 360H730" stroke="#c8c0b1" stroke-width="4" stroke-linecap="round"/>
  <path d="M400 75V365" stroke="#ded9cd" stroke-width="3" stroke-dasharray="8 12"/>
  <g fill="none" stroke="#1f1e1b" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="135" cy="178" r="25" fill="#f6f4ef"/>
    <path d="M160 190L270 245L345 345M270 245L220 350M270 245L165 305"/>
    <circle cx="535" cy="218" r="25" fill="#f6f4ef"/>
    <path d="M560 230L650 295L680 345M650 295L585 350M650 295L550 330"/>
  </g>
  <path d="M365 245h70l-18-15 8-10 38 30-38 30-8-10 18-15h-70z" fill="#b7891c"/>
